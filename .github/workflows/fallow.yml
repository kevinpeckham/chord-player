name: fallow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    name: fallow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fallow audit
        run: bunx fallow audit --ci --format sarif --output fallow.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('fallow.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fallow.sarif
          category: fallow
